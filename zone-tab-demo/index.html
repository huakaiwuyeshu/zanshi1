function ruleFields(scope,tab=null,parent=null){
  const global=scope==='global',single=global&&state.type==='single';
  const obj=global?state.global:tab;
  const twoTop=!global&&state.type==='multi'&&state.depth===2&&!parent;
  const rulePool=global?(state.global&&state.global.poolId||''):twoTop?(tab&&tab.poolId||''):state.type==='multi'&&state.depth===1?(state.global&&state.global.poolId||''):(parent&&parent.poolId||state.poolId);
  const rulesPool=poolById(rulePool);
  const keys=single?['game','price']:twoTop?['game','price','pool']:['game','price','rule'];
  return '<div class="rule-grid'+(single?' single':'')+'">'+keys.map(key=>{
    const inheritance=!global&&key!=='rule'&&key!=='pool'?inherited(parent,key):null;
    const value=inheritance?inheritance.value:key==='pool'?obj.poolId:obj[key];
    const label={game:'游戏',price:'价格类型',rule:'号池规则',pool:'号池'}[key];
    const id=global?'global-'+key:'field-'+tab.id+'-'+key;
    const options=key==='game'?GAMES:key==='price'?PRICES.map(p=>({id:p.id,name:p.name+'价格'})):key==='pool'?POOLS:(rulesPool?rulesPool.rules:[]);
    const noPool=!global&&!twoTop&&key==='rule'&&state.type==='multi'&&state.depth===2&&!rulePool;
    const oneNoPool=!global&&key==='rule'&&state.type==='multi'&&state.depth===1&&!rulePool;
    const disabled=!!inheritance||noPool||oneNoPool;
    const placeholder=noPool?'请先在一级tab选择号池':oneNoPool?'请先在全局展示选择号池':key==='rule'||key==='pool'||single?'请选择':'不限';
    const errorKey=single?'global.'+key:twoTop&&key==='pool'?tab.id+'.poolId':tab?tab.id+'.conditions':'';
    const field=key==='pool'||key==='rule'
      ? searchableSelect({id,scope:'tab',key:key==='pool'?'poolId':'rule',tabId:tab&&tab.id||'',options,value,placeholder,disabled,errorKey,notice:twoTop&&poolNotices[tab.id]||''})
      : '<select id="'+id+'" class="select-input'+(!value?' placeholder':'')+'" data-tab-field="'+key+'" data-tab-id="'+(tab?tab.id:'')+'"'+(disabled?' disabled':'')+' data-error-for="'+errorKey+'">'+selectOptions(options,value,placeholder)+'</select>';

  }).join('')+'</div>';

function validateState(){
  const result=[];
  const add=(key,message,topId='',tabId='')=>result.push({key,message,topId,tabId});
  if(!state.pageName.trim())add('pageName','请输入页面名称');
  if(!(state.type==='multi'&&state.depth===2)&&!state.poolId)add('poolId','请选择业务活动');
  if(state.type==='single'){
    const rows=Array.isArray(state.supportGames)?state.supportGames:[];
    if(!rows.length)add('supportGames.count','至少配置1行支持游戏');
    const seen=new Map();
    rows.forEach((row,index)=>{
      if(!row.game)add('support.'+index+'.game','请选择游戏');
      else if(seen.has(row.game))add('support.'+index+'.game','游戏不能重复');
      else seen.set(row.game,index);
      if(!row.price)add('support.'+index+'.price','请选择价格类型');
      const n=Number(row.priority);
      if(row.priority===''||!Number.isInteger(n)||n<1||n>100)add('support.'+index+'.priority','请输入1—100的整数');
    });
    return result;
  }
  if(state.depth===1&&!state.global.poolId)add('global.poolId','请选择号池');
  if(state.tabs.length<1||state.tabs.length>10)add('tabs.count','每层须有1—10个tab');
  const checkTab=(tab,parent=null)=>{
    const topId=parent?parent.id:tab.id;
    if(!tab.name.trim())add(tab.id+'.name','请输入展示名称',topId,tab.id);
    else if(codeLength(tab.name)>10)add(tab.id+'.name','展示名称不能超过10个字',topId,tab.id);
    const n=Number(tab.priority);
    if(tab.priority===''||!Number.isInteger(n)||n<1||n>100)add(tab.id+'.priority','请输入1—100的整数',topId,tab.id);
    if(parent||state.depth===1){
      const value=effective(tab,parent);
      if(!value.game||!value.price)add(tab.id+'.conditions',state.depth===2?'游戏和价格类型须在一级tab或本tab中确定':'游戏和价格类型须在上级或本tab中确定',topId,tab.id);
    }
  };
  sorted(state.tabs).forEach(top=>{
    checkTab(top);
    if(state.depth===2){
      if(!top.poolId)add(top.id+'.poolId','请选择号池',top.id,top.id);
      if(top.children.length<1||top.children.length>10)add(top.id+'.count','每层须有1—10个tab',top.id,top.id);
      sorted(top.children).forEach(child=>checkTab(child,top));
    }
  });
  return result;
}

function deleteTab(id){
  const found=findTab(id);if(!found)return;
  const tabs=found.parent?found.parent.children:state.tabs;
  if(tabs.length<=1)return;
  const order=sorted(tabs),oldIndex=order.findIndex(t=>t.id===id);
  tabs.splice(tabs.findIndex(t=>t.id===id),1);
  const next=sorted(tabs)[Math.min(oldIndex,tabs.length-1)].id;
  if(found.parent)state.selectedChildren[found.parent.id]=next;

  lastConfirmed=false;renderAll();

function confirmCopy(){
  const source=state.tabs.find(t=>t.id===$('copySource').value),target=activeTop();

  const available=Math.max(0,10-target.children.length);

  const candidates=sorted(source.children).slice(0,available);
  const start=Math.max(0,...target.children.map(t=>t.ordinal));
  const allowed=new Set((poolById(target.poolId)?.rules||[]).map(rule=>rule.id));
  let cleared=0;
  const copies=candidates.map((t,i)=>{
    const copied=clone(t);
    delete copied.id;delete copied.created;
    copied.ordinal=start+i+1;copied.children=[];copied.background='';
    if(copied.rule&&!allowed.has(copied.rule)){copied.rule='';cleared++;}
    return makeTab(start+i+1,copied);
  });
  target.children.push(...copies);
  if(copies.length)state.selectedChildren[target.id]=copies[0].id;

  const suffix=source.children.length>available?'；超过10个的部分已截断':'';

function clearRulesOutsidePool(poolId,top=null){
  const allowed=new Set((poolById(poolId)?.rules||[]).map(rule=>rule.id));
  let count=0;
  if(state.type==='multi'&&state.depth===2&&top){
    (top.children||[]).forEach(child=>{if(child.rule&&!allowed.has(child.rule)){child.rule='';count++;}});
    showPoolNotice(top.id,count);
    return count;
  }
  state.global.rule='';
  (state.tabs||[]).forEach(item=>{
    if(item.rule&&!allowed.has(item.rule))item.rule='';
    (item.children||[]).forEach(child=>{if(child.rule&&!allowed.has(child.rule))child.rule='';});
  });
  return count;
}
function handleField(element,isComposing=false){

    const scope=element.dataset.searchScope,key=element.dataset.searchKey;

      const found=findTab(element.dataset.searchTabId);if(!found)return;
      found.tab[key]=value;
      if(key==='poolId'&&state.depth===2&&!found.parent)clearRulesOutsidePool(value,found.tab);
    }
  }else if(element.dataset.state){
    const key=element.dataset.state;
    if(key==='type'||key==='depth'){
      saveCurrentMode();
      if(key==='type'){
        if(value==='single'){state.type='single';state.depth=1;}
        else{state.type='multi';state.depth=state.lastMultiDepth||1;}
      }else{
        state.depth=Number(value);state.lastMultiDepth=state.depth;
      }
      restoreMode(modeKey());ensureTabs();
    }else{
      if(key==='poolId'){
        state.poolId=value;
        if(state.type==='multi'&&state.depth===1)state.global.poolId=value;
        clearRulesOutsidePool(selectedPoolId());
      }else state[key]=value;
      ensureTabs();
    }
  }else if(element.dataset.global){
    const key=element.dataset.global;
    state.global[key]=value;
    if(key==='poolId')clearRulesOutsidePool(value);
  }else if(element.dataset.supportField){
    const index=Number(element.dataset.supportIndex),row=state.supportGames[index];
    if(!row)return;
    row[element.dataset.supportField]=value;
    ensureSingleSelection();
  }else if(element.dataset.tabField){
    const found=findTab(element.dataset.tabId);if(!found)return;
    found.tab[element.dataset.tabField]=value;
    if(element.dataset.tabField==='equipment')found.tab.equipmentGame=effective(found.tab,found.parent).game;
  }else if(element.dataset.check){
    const key=element.dataset.check;
    if(key==='devices'&&value==='全部')state.devices=element.checked?DEVICES.slice():[];
    else{
      const set=new Set(state[key]);if(element.checked)set.add(value);else set.delete(value);
      if(key==='devices'){

    }
  }else return;
  lastConfirmed=false;ensureSingleSelection();reconcileEquipment();
  const textField=element.tagName==='INPUT'&&['text','number'].includes(element.type);

      if(counter)counter.textContent=codeLength(value)+'/10';

  }else renderAll();
}

function handleUpload(input){
  const file=input.files&&input.files[0];if(!file)return;
  const epoch=stateEpoch,scope=input.dataset.uploadScope,field=input.dataset.uploadField,tabId=input.dataset.tabId;
  if(file.type&&!file.type.startsWith('image/')){toast('请选择有效的图片文件','error');input.value='';return;}
  const reader=new FileReader();
  reader.onerror=()=>toast('图片读取失败，请重新选择','error');
  reader.onload=()=>{
    const url=reader.result,probe=new Image();
    probe.onerror=()=>toast('无法预览这张图片，请选择其他图片','error');
    probe.onload=()=>{
      if(stateEpoch!==epoch)return;

      else{const found=findTab(tabId);if(!found)return;found.tab[field]=url;}
      lastConfirmed=false;renderAll();toast('图片已更新');

    probe.src=url;
  };
  reader.readAsDataURL(file);
}
let openSearchSelect=null, searchOptionIndex=-1;
function searchSelectOptions(root){return [...root.querySelectorAll('.search-option')].filter(option=>!option.hidden);}

function filterSearchSelect(root,query=''){

function closeSearchSelect(){

  if(option){event.preventDefault();commitSearchSelect(option.closest('[data-search-select]'),option.dataset.searchOption);return;}
  const trigger=event.target.closest&&event.target.closest('.search-select-trigger');
  if(trigger){event.preventDefault();const root=trigger.closest('[data-search-select]');if(root.classList.contains('open'))closeSearchSelect();else openSearchSelectMenu(root);return;}
  if(openSearchSelect&&!event.target.closest('[data-search-select]'))closeSearchSelect();
  const button=event.target.closest('button[data-action]');if(!button||button.disabled)return;
  const action=button.dataset.action;
  if(action==='example')loadExample(button.dataset.example);
  else if(action==='select-single-game')selectSingleGame(button.dataset.gameId);
  else if(action==='add-support')addSupport(Number(button.dataset.supportIndex));
  else if(action==='remove-support')removeSupport(Number(button.dataset.supportIndex));
  else if(action==='select-tab')selectTab(button.dataset.tabId,!!button.closest('#phoneScroll'));
  else if(action==='add-tab')addTab(Number(button.dataset.level),button.dataset.parentId);
  else if(action==='delete-tab')deleteTab(button.dataset.tabId);
  else if(action==='open-copy')openCopy();
  else if(action==='close-copy')$('copyDialog').close();
  else if(action==='confirm-copy')confirmCopy();
  else if(action==='remove-image'){
    if(button.dataset.scope==='header')state.headers[button.dataset.field]='';
    else{const found=findTab(button.dataset.tabId);if(found)found.tab[button.dataset.field]='';}
    lastConfirmed=false;renderAll();
  }else if(action==='validate'){
    validationAttempted=true;errors=validateState();lastConfirmed=!errors.length;refreshErrors();renderStrips();
    if(errors.length){locateFirstError();toast('有 '+errors.length+' 项配置需要完善','error');}
    else toast('校验通过（演示，不保存）','success');
  }else if(action==='locate-error')locateFirstError();
  else if(action==='cancel'){
    stateEpoch++;state=clone(baseline);validationAttempted=false;lastConfirmed=false;errors=[];renderAll(true);
    toast(activeExample==='empty'?'已恢复默认配置':'已恢复当前示例的初始配置');
  }
});
$('configForm').addEventListener('submit',event=>{event.preventDefault();document.querySelector('[data-action="validate"]').click();});
$('copyDialog').addEventListener('click',event=>{if(event.target===$('copyDialog')){const r=$('copyDialog').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)$('copyDialog').close();}});
loadExample('one',false);
</script>
</body>
</html>
